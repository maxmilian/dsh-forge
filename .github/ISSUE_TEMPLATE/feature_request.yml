name: Feature request
description: Propose a focused Gitea or Forgejo integration
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed integration
      description: Describe the tool, API endpoint, and expected result.
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - Shared by Gitea and Forgejo
        - Gitea-specific
        - Forgejo-specific
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Access type
      options:
        - Read-only
        - Write operation requiring approval
        - Unknown
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: API documentation or examples
      description: Link official Gitea or Forgejo API documentation when available.
