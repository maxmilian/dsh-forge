name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
      - run: bun pm pack --dry-run
      - name: Install DSH CLI
        run: bun add --global @deepseek-ai/dsh@0.1.1-rc.2 pnpm@10.33.2
      - run: bun run smoke:dsh
